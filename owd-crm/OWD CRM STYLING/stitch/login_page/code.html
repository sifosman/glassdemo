<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>Login - OWD CRM</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&amp;family=JetBrains+Mono:wght@400;500;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "error-container": "#ffdad6",
                        "error": "#ba1a1a",
                        "on-primary-fixed-variant": "#2d486d",
                        "outline-variant": "#c4c6cf",
                        "on-surface-variant": "#43474e",
                        "primary-container": "#1e3a5f",
                        "secondary-container": "#86f2e4",
                        "tertiary-fixed-dim": "#ffb95f",
                        "surface": "#f7f9fb",
                        "on-surface": "#191c1e",
                        "secondary": "#006a61",
                        "on-secondary-fixed-variant": "#005049",
                        "tertiary-fixed": "#ffddb8",
                        "surface-container-highest": "#e0e3e5",
                        "primary-fixed": "#d5e3ff",
                        "surface-variant": "#e0e3e5",
                        "on-tertiary": "#ffffff",
                        "secondary-fixed-dim": "#6bd8cb",
                        "on-primary": "#ffffff",
                        "surface-container-high": "#e6e8ea",
                        "inverse-primary": "#adc8f5",
                        "primary-fixed-dim": "#adc8f5",
                        "on-primary-container": "#8aa4cf",
                        "on-primary-fixed": "#001c3b",
                        "on-secondary-fixed": "#00201d",
                        "background": "#f7f9fb",
                        "inverse-surface": "#2d3133",
                        "tertiary": "#361f00",
                        "on-background": "#191c1e",
                        "surface-tint": "#455f87",
                        "surface-dim": "#d8dadc",
                        "tertiary-container": "#533200",
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed-variant": "#653e00",
                        "on-error-container": "#93000a",
                        "secondary-fixed": "#89f5e7",
                        "surface-container-low": "#f2f4f6",
                        "inverse-on-surface": "#eff1f3",
                        "surface-bright": "#f7f9fb",
                        "on-secondary-container": "#006f66",
                        "outline": "#74777f",
                        "on-tertiary-container": "#e39100",
                        "surface-container": "#eceef0",
                        "primary": "#022448",
                        "on-tertiary-fixed": "#2a1700",
                        "surface-container-lowest": "#ffffff",
                        "on-error": "#ffffff"
                    },
                    fontFamily: {
                        "headline": ["Inter"],
                        "body": ["Inter"],
                        "label": ["Inter"],
                        "mono": ["JetBrains Mono"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
<style>
        .glass-gradient {
            background: linear-gradient(135deg, #f7f9fb 0%, #eceef0 100%);
        }
        .primary-gradient {
            background: linear-gradient(135deg, #022448 0%, #1e3a5f 100%);
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
</head>
<body class="bg-surface text-on-surface font-body min-h-screen flex items-center justify-center p-4">
<!-- Suppressed Navigation Shell as per Rule: Linear/Transactional pages hide the shell -->
<div class="w-full max-w-md relative">
<!-- Background decorative element: Glass refraction effect -->
<div class="absolute -top-12 -left-12 w-64 h-64 bg-secondary/5 rounded-full blur-3xl"></div>
<div class="absolute -bottom-12 -right-12 w-64 h-64 bg-primary/5 rounded-full blur-3xl"></div>
<!-- Main Login Card -->
<main class="relative bg-surface-container-lowest rounded-xl shadow-[0_20px_40px_rgba(0,28,59,0.06)] overflow-hidden">
<div class="p-8 md:p-10">
<!-- Brand Header -->
<div class="flex flex-col items-center mb-10">
<div class="mb-4 flex items-center justify-center w-12 h-12 rounded-lg bg-primary-container text-white">
<span class="material-symbols-outlined text-2xl" data-icon="window">window</span>
</div>
<h1 class="font-headline font-black text-2xl tracking-tight text-primary">OWD CRM</h1>
<p class="text-on-surface-variant text-sm mt-1">Glass Industry Management</p>
</div>
<!-- Form Section -->
<div class="space-y-6">
<div class="text-center mb-8">
<h2 class="text-xl font-bold text-on-surface">Welcome back</h2>
<p class="text-on-surface-variant text-sm">Please enter your credentials to access your dashboard.</p>
</div>
<form class="space-y-5">
<!-- Email Field -->
<div>
<label class="block text-sm font-semibold text-on-surface mb-2" for="email">Email Address</label>
<div class="relative group">
<input class="w-full h-12 px-4 bg-surface-container-lowest border border-outline-variant focus:border-transparent focus:ring-0 focus:outline-none transition-all rounded-lg text-on-surface placeholder:text-on-surface-variant/50 focus:shadow-[0_2px_0_0_#006a61]" id="email" name="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-2">
<label class="block text-sm font-semibold text-on-surface" for="password">Password</label>
<a class="text-xs font-semibold text-secondary hover:text-secondary-fixed-dim transition-colors" href="#">Forgot password?</a>
</div>
<div class="relative group">
<input class="w-full h-12 px-4 bg-surface-container-lowest border border-outline-variant focus:border-transparent focus:ring-0 focus:outline-none transition-all rounded-lg text-on-surface placeholder:text-on-surface-variant/50 focus:shadow-[0_2px_0_0_#006a61]" id="password" name="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Sign In Button -->
<button class="w-full h-12 primary-gradient text-on-primary font-bold rounded-lg hover:opacity-90 active:scale-[0.98] transition-all flex items-center justify-center gap-2 mt-4 shadow-sm" type="submit">
                            Sign In
                            <span class="material-symbols-outlined text-lg" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
</div>
<!-- Footnote -->
<div class="mt-10 pt-8 border-t border-surface-container-high text-center">
<p class="text-on-surface-variant text-xs">
                        Don't have an account? 
                        <a class="text-secondary font-bold hover:underline ml-1" href="#">Contact Support</a>
</p>
</div>
</div>
<!-- Side Visual Accent (Hidden on mobile) -->
<div class="hidden md:block absolute top-0 right-0 w-1 h-full primary-gradient opacity-20"></div>
</main>
<!-- Trust Indicator -->
<div class="mt-8 flex items-center justify-center gap-6 opacity-40 grayscale hover:grayscale-0 transition-all duration-500">
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-xs" data-icon="lock" style="font-variation-settings: 'FILL' 1;">lock</span>
<span class="text-[10px] font-mono uppercase tracking-widest">Secure 256-bit SSL</span>
</div>
<div class="flex items-center gap-1">
<span class="material-symbols-outlined text-xs" data-icon="verified_user" style="font-variation-settings: 'FILL' 1;">verified_user</span>
<span class="text-[10px] font-mono uppercase tracking-widest">ISO 27001 Certified</span>
</div>
</div>
</div>
</body></html>
